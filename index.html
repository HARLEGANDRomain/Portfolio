    <style>
      /* Static LCP Splash styles (removed automatically when React mounts) */
      .lcp-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #020617; /* Matches bg-slate-950 */
        z-index: 9999;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .lcp-content {
        text-align: center;
        user-select: none;
      }
      .lcp-title {
        font-size: clamp(4rem, 10vw, 9rem);
        font-weight: 900;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        color: #f8fafc;
        line-height: 0.9;
        margin: 0 0 28px 0;
        text-shadow: 0 4px 60px rgba(99,102,241,0.4);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .lcp-cursor {
        margin-left: 8px;
        color: #6366f1;
        animation: lcp-blink 1s step-end infinite;
      }
      .lcp-name {
        font-size: clamp(0.85rem, 1.4vw, 1.1rem);
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(226,232,240,0.9);
        margin: 0 0 6px 0;
      }
      .lcp-desc {
        font-size: clamp(0.7rem, 1vw, 0.85rem);
        font-weight: 400;
        color: rgba(148,163,184,0.8);
        letter-spacing: 0.05em;
        margin: 0 0 48px 0;
      }
      .lcp-btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #e2e8f0;
        border: none;
        border-bottom: 1.5px solid rgba(226,232,240,0.5);
        background: transparent;
        padding-bottom: 4px;
        cursor: pointer;
      }
      @keyframes lcp-blink {
        from, to { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static Splash Screen for LCP Optimization (removed automatically when React mounts) -->
      <div class="lcp-splash">
        <div class="lcp-content">
          <h1 class="lcp-title">PORTFOLIO<span class="lcp-cursor">_</span></h1>
          <p class="lcp-name">HARLEGAND Romain</p>
          <p class="lcp-desc">Technical Game Designer &nbsp;·&nbsp; UX/UI Designer</p>
          <button class="lcp-btn">
            Explorer →
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
